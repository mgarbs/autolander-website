# Secrets to set via `wrangler secret put <NAME>`:
#   OPENAI_API_KEY                used by chat and admin AI summary
#   META_PIXEL_ID                 numeric Pixel ID (e.g. 2087440198847151)
#   META_CAPI_ACCESS_TOKEN        Conversions API access token
#   META_AD_ACCOUNT_ID            ad account, format act_XXXXXXXXX
#   META_MARKETING_ACCESS_TOKEN   token with ads_read (can equal META_CAPI_ACCESS_TOKEN)
#   META_TEST_EVENT_CODE          optional, e.g. TEST12345 (unset for production)
#   GHL_PRIVATE_INTEGRATION_TOKEN private integration/OAuth token with contact + workflow scopes
#   GHL_LOCATION_ID               GHL location/sub-account id
#   GHL_WORKFLOW_ID               "Website Demo Request" workflow id
#   GHL_CUSTOM_FIELD_MAP          JSON map of captured fields to GHL contact custom-field IDs
#   SEND_WORKER_LEAD_CAPI         optional; set to "false" only if GHL sends server Lead with the same metaEventId
#   ENABLE_LEGACY_CALENDLY_WEBHOOK optional; set "true" only to temporarily accept old Calendly Schedule webhooks
#   CALENDLY_SIGNING_KEY          legacy only, required if the legacy Calendly webhook is enabled
#   ADMIN_PASSWORD                you choose
#   ADMIN_SESSION_SECRET          random 32+ bytes for cookie HMAC
