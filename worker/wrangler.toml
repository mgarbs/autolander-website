name = "autolander-chatbot"
main = "src/index.js"
compatibility_date = "2026-04-23"
account_id = "6d0317be0a7586e7f90e454db7c6989a"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://autolander.ai,https://www.autolander.ai,https://mgarbs.github.io,http://localhost:5173,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5176,http://localhost:4173,http://127.0.0.1:4173"
OPENAI_MODEL = "gpt-5.4-mini"
MAX_OUTPUT_TOKENS = "360"
ADMIN_AI_MODEL = "gpt-5.4-mini"
ADMIN_AI_MAX_OUTPUT_TOKENS = "8000"
ADMIN_AI_REASONING_EFFORT = "high"
DAILY_CHAT_LIMIT = "160"
IP_DAILY_LIMIT = "12"
IP_HOURLY_LIMIT = "5"
DAILY_SUPPORT_LIMIT = "40"
SUPPORT_IP_DAILY_LIMIT = "3"
SUPPORT_IP_HOURLY_LIMIT = "2"
SUPPORT_EMAIL = "sales@autolander.ai"
DEMO_URL = "https://calendly.com/autolander/demo"
REQUIRE_TURNSTILE = "false"

[[kv_namespaces]]
binding = "CHAT_RATE_LIMITS"
id = "773a6f731ade45619079fc5acca6787e"
preview_id = "4a6687d31adc4bb19fd01b2d47e01804"

# Conversion tracking + admin dashboard storage.
[[kv_namespaces]]
binding = "TRACKING"
id = "27aed049b50043b19164a2bb9c51c143"
preview_id = "273697d477e84296a0152a690e95884c"

# Secrets to set via `wrangler secret put <NAME>`:
#   OPENAI_API_KEY                used by chat and admin AI summary
#   META_PIXEL_ID                 numeric Pixel ID (e.g. 2087440198847151)
#   META_CAPI_ACCESS_TOKEN        Conversions API access token
#   META_AD_ACCOUNT_ID            ad account, format act_XXXXXXXXX
#   META_MARKETING_ACCESS_TOKEN   token with ads_read (can equal META_CAPI_ACCESS_TOKEN)
#   META_TEST_EVENT_CODE          optional, e.g. TEST12345 (unset for production)
#   CALENDLY_SIGNING_KEY          from Calendly webhook subscription
#   ADMIN_PASSWORD                you choose
#   ADMIN_SESSION_SECRET          random 32+ bytes for cookie HMAC
