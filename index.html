    <script>
      (() => {
        const staleAppHashRoutes = new Set(['#/login', '#/sign-in', '#/signin', '#/auth', '#/signup']);
        if (staleAppHashRoutes.has(window.location.hash.toLowerCase())) {
          window.history.replaceState(null, '', window.location.pathname + window.location.search);

      })();
    </script>
